[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-carve"
version = "0.1.0"
description = "MkDocs plugin that renders Carve (.crv) pages via carve-py."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "markup-carve" }]
keywords = ["mkdocs", "carve", "markup", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "mkdocs>=1.5",
    # carve-lang is the Carve engine (the PyO3 binding over carve-rs). This was
    # a git dependency pinned to a revision, because the package did not exist
    # on PyPI - which also meant this package could not be published at all,
    # since PyPI refuses a distribution with a direct-URL dependency.
    #
    # carve-lang 0.1.0 was published on 2026-08-12, so the pin is a version
    # range now.
    #
    # The floor is 0.1.1, not the first release: 0.1.0 renders
    # `srcset="safe.png 1x, javascript:alert(1) 2x"` unsanitized, because a
    # list-valued URL attribute was probed only on its first entry. 0.1.1
    # carries the fix - measured against both, see tests/test_engine_floor.py.
    # The floor is a claim about the oldest engine this plugin works with, so it
    # moves when an older engine genuinely stops working, not because a newer one
    # exists.
    #
    # The ceiling follows from the engine's own versioning rather than from a
    # judgement about its API: on this org's 0.x line `0.1` is the major and the
    # third digit is the minor, so `<0.2.0` admits every engine minor (0.1.2,
    # 0.1.3, ...) and excludes only a release the engine itself declares
    # breaking. It is not a cap to relax at each engine minor; it is the point at
    # which someone has to look. Without it the range admits, by the engine's own
    # rules, exactly the changes that break this plugin.
    #
    # A range is the right shape for a consumer and the wrong one for a test run,
    # so CI installs under `constraints-ci.txt` instead. See that file.
    "carve-lang>=0.1.1,<0.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    # The emoji names the `emoji` setting resolves come from `pymdownx.emoji`,
    # which is what a Material for MkDocs site's Markdown pages already use.
    # It is not a runtime dependency - a site that leaves `emoji` at `none`
    # never asks for a name table - but the example site turns it on, so the
    # end-to-end build test needs it.
    "pymdown-extensions>=10",
]

[project.urls]
Homepage = "https://github.com/markup-carve/mkdocs-carve"
Source = "https://github.com/markup-carve/mkdocs-carve"
Documentation = "https://github.com/markup-carve/mkdocs-carve#readme"
Changelog = "https://github.com/markup-carve/mkdocs-carve/blob/main/CHANGELOG.md"
Issues = "https://github.com/markup-carve/mkdocs-carve/issues"

[project.entry-points."mkdocs.plugins"]
carve = "mkdocs_carve.plugin:CarvePlugin"

[tool.setuptools]
packages = ["mkdocs_carve"]
