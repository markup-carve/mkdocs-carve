[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-carve"
version = "0.1.6"
description = "MkDocs plugin that renders Carve (.crv) pages via carve-py."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "markup-carve" }]
keywords = ["mkdocs", "carve", "markup", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "mkdocs>=1.5",
    # carve-lang is the Carve engine (the PyO3 binding over carve-rs). On
    # `next2` it is the unreleased Carve 0.2 binding, pinned to a carve-py
    # `next2` commit and built from source (Rust and maturin are needed). A
    # direct-URL dependency cannot be published to PyPI, so this branch is not
    # releasable until carve-lang 0.2 is; the range comes back then.
    "carve-lang @ git+https://github.com/markup-carve/carve-py@5d5457b0b4668f93fba46df465bdc588609b18e2",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    # The emoji names the `emoji` setting resolves come from `pymdownx.emoji`,
    # which is what a Material for MkDocs site's Markdown pages already use.
    # It is not a runtime dependency - a site that leaves `emoji` at `none`
    # never asks for a name table - but the example site turns it on, so the
    # end-to-end build test needs it.
    "pymdown-extensions>=10",
]

[project.urls]
Homepage = "https://github.com/markup-carve/mkdocs-carve"
Source = "https://github.com/markup-carve/mkdocs-carve"
Documentation = "https://github.com/markup-carve/mkdocs-carve#readme"
Changelog = "https://github.com/markup-carve/mkdocs-carve/blob/main/CHANGELOG.md"
Issues = "https://github.com/markup-carve/mkdocs-carve/issues"

[project.entry-points."mkdocs.plugins"]
carve = "mkdocs_carve.plugin:CarvePlugin"

[tool.setuptools]
packages = ["mkdocs_carve"]
