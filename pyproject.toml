[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-carve"
version = "0.1.0"
description = "MkDocs plugin that renders Carve (.crv) pages via carve-py."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "markup-carve" }]
keywords = ["mkdocs", "carve", "markup", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "mkdocs>=1.5",
    # Pinned to an exact revision, and named by the repository's CURRENT name.
    #
    # This had no ref, so it floated on whatever was on the default branch at
    # install time - two installs a day apart could differ with nothing to read.
    # There is no registry alternative: carve-py is not on PyPI (carve#499), so
    # a git dependency is the only option and the ref is what makes it honest.
    #
    # The old URL said `python-carve`, which only resolved through GitHub's
    # rename redirect; that redirect stops working the moment anyone creates a
    # repository with the old name.
    "carve-lang @ git+https://github.com/markup-carve/carve-py@31d031ec7704d5dca06d4ecee70fdc45c0e1b7fc",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/markup-carve/mkdocs-carve"
Source = "https://github.com/markup-carve/mkdocs-carve"
Documentation = "https://github.com/markup-carve/mkdocs-carve#readme"
Changelog = "https://github.com/markup-carve/mkdocs-carve/blob/main/CHANGELOG.md"
Issues = "https://github.com/markup-carve/mkdocs-carve/issues"

[project.entry-points."mkdocs.plugins"]
carve = "mkdocs_carve.plugin:CarvePlugin"

[tool.setuptools]
packages = ["mkdocs_carve"]
