name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Each job declares timeout-minutes so a hung step fails fast
# instead of inheriting the 360-minute GitHub default.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Under `constraints-ci.txt`, so this job measures a stated engine rather
      # than whatever PyPI serves at the moment it runs. See that file.
      - name: Install
        run: pip install -e ".[test]" -c constraints-ci.txt

      - name: Verify the engine this run measures
        run: |
          resolved="$(python -c 'from importlib.metadata import version; print(version("carve-lang"))')"
          pinned="$(sed -n 's/^carve-lang==\([^ ;#]*\).*/\1/p' constraints-ci.txt)"
          # A carve-py git pin: compare the commit pip recorded for the install.
          sha="$(sed -n 's|^carve-lang @ git+https://github.com/markup-carve/carve-py@\([0-9a-f]\{40\}\)$|\1|p' constraints-ci.txt)"
          if [ -n "$sha" ]; then
            pinned="$sha"
            resolved="$(python -c 'import json; from importlib.metadata import distribution; print(json.loads(distribution("carve-lang").read_text("direct_url.json"))["vcs_info"]["commit_id"])')"
          fi
          echo "carve-lang resolved=${resolved} pinned=${pinned}"
          if [ -z "$pinned" ]; then
            echo "::error::constraints-ci.txt names no carve-lang pin, so this run measured an unstated engine"
            exit 1
          fi
          if [ "$resolved" != "$pinned" ]; then
            echo "::error::installed carve-lang ${resolved} is not the pinned ${pinned}"
            exit 1
          fi

      - name: Test
        run: pytest tests/
