name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Under `constraints-ci.txt`, so this job measures a stated engine rather
      # than whatever PyPI serves at the moment it runs. See that file.
      - name: Install
        run: pip install -e ".[test]" -c constraints-ci.txt

      - name: Verify the engine this run measures
        run: |
          resolved="$(python -c 'from importlib.metadata import version; print(version("carve-lang"))')"
          pinned="$(sed -n 's/^carve-lang==\([^ ;#]*\).*/\1/p' constraints-ci.txt)"
          echo "carve-lang resolved=${resolved} pinned=${pinned}"
          if [ -z "$pinned" ]; then
            echo "::error::constraints-ci.txt names no carve-lang pin, so this run measured an unstated engine"
            exit 1
          fi
          if [ "$resolved" != "$pinned" ]; then
            echo "::error::installed carve-lang ${resolved} is not the pinned ${pinned}"
            exit 1
          fi

      # The include cases skip themselves when the engine has no
      # `render_with_includes`, so without this a pin that lost the entry point
      # would read as a green run over seventeen cases nobody measured.
      - name: The pinned engine exposes the include entry point
        run: |
          python - <<'EOF'
          import carve, sys
          if not hasattr(carve, "render_with_includes"):
              print("::error::pinned carve-lang exposes no render_with_includes")
              sys.exit(1)
          EOF

      - name: Test
        run: pytest tests/
