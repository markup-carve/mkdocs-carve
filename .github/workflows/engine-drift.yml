name: Engine drift

# The engine is a GIT DEPENDENCY pinned to a revision. A pin makes drift
# deliberate, but nothing notices when the pin has fallen behind - and a
# push-only CI reports the state of the day someone last touched the repo.
#
# That is not hypothetical across the org: carve-hexapdf pinned nothing, was not
# pushed for five days while two AST renames landed upstream, and its badge
# stayed green on a stale run while a fresh install rendered bold text unstyled
# and dropped every footnote marker (carve-hexapdf#10). The pin from #2 stops
# that happening by surprise here; this job is what tells you the pin is old
# before someone else finds out.
#
# There is no registry alternative to watch instead - carve-py is not published
# to PyPI at all (carve#499) - so the pinned revision IS the version, and this
# is the only thing that can report its age.
#
# It reports rather than gates on lag: the engine moving is not a defect here,
# and a job that goes red for something outside the repository teaches people to
# ignore it. It DOES fail when the pinned revision is not a real commit on
# carve-py's main - a typo, a force-pushed branch, a revision that no longer
# exists - because that is a broken install waiting to happen.

on:
  schedule:
    # 05:00 UTC daily, after the engine repos have had a night to settle.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out carve-py
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-py
          path: carve-py
          fetch-depth: 0

      - name: Compare the pinned revision against carve-py main
        run: |
          set -euo pipefail
          rev="$(grep -oE 'carve-py@[0-9a-f]{40}' pyproject.toml | grep -oE '[0-9a-f]{40}' | head -1)"
          if [ -z "${rev}" ]; then
            echo "::error::no 40-hex revision found after carve-py@ in pyproject.toml; the engine dependency is not pinned"
            exit 1
          fi
          if ! git -C carve-py cat-file -e "${rev}^{commit}" 2>/dev/null; then
            echo "::error::pyproject.toml pins ${rev}, which is not a commit in carve-py"
            exit 1
          fi
          if ! git -C carve-py merge-base --is-ancestor "${rev}" origin/main; then
            echo "::error::carve-py ${rev} is not on main, so the pin came from an unmerged or rewritten branch"
            exit 1
          fi
          behind="$(git -C carve-py rev-list --count "${rev}..origin/main")"
          echo "pinned engine: carve-py ${rev} ($(git -C carve-py log -1 --format=%s "${rev}"))"
          echo "carve-py main is ${behind} commit(s) ahead"
          if [ "${behind}" -gt 0 ]; then
            echo "::warning::the pinned engine is ${behind} carve-py commit(s) behind main"
          fi

  # The pin makes the ENGINE deterministic; mkdocs and the rest of the
  # environment still float. A scheduled run of the real suite is what catches
  # one of those changing underneath.
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: pytest tests/
